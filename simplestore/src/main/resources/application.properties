spring.application.name=simplestore

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=simplestore;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:simplestore}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
